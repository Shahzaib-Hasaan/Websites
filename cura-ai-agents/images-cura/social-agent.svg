  <path d="M200 859l8 9 16-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="258" y="850" font-size="25" font-weight="700" fill="#143434">Booked from a DM</text>
  <text x="258" y="886" font-size="21" fill="#2c6d6d">Fri 3:40 PM &#183; no staff touch</text>
</g>

<g filter="url(#s-drop)"><rect x="230" y="996" width="420" height="76" rx="38" fill="#fff" fill-opacity=".95"/></g>
<text x="440" y="1044" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700" fill="#1f5a5a">Replies in seconds</text>
<g filter="url(#s-drop)"><rect x="286" y="1096" width="308" height="72" rx="36" fill="#1f5a5a"/></g>
<circle cx="332" cy="1132" r="9" fill="#9089f0"/>
<text x="440" y="1142" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700" fill="#fff" letter-spacing="1">DM &#8594; BOOKED</text>
