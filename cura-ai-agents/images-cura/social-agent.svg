<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1200" width="880" height="1200" role="img">
<defs>
  <linearGradient id="s-room" x1="0" y1="0" x2="0.32" y2="1">
    <stop offset="0" stop-color="#e8f4f4"/><stop offset=".5" stop-color="#b8dada"/><stop offset="1" stop-color="#2c6d6d"/>
  </linearGradient>
  <radialGradient id="s-glow" cx=".5" cy=".24" r=".62">
    <stop offset="0" stop-color="#fff" stop-opacity=".84"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="s-badge" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#5aa0a0"/><stop offset="1" stop-color="#1f5a5a"/>
  </linearGradient>
  <linearGradient id="s-badge2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a9494"/><stop offset="1" stop-color="#255f5f"/>
  </linearGradient>
  <linearGradient id="s-sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="s-card" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/><stop offset="1" stop-color="#e6f3f3" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="s-me" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a9494"/><stop offset="1" stop-color="#1f5a5a"/>
  </linearGradient>
  <filter id="s-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="s-lift" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#123c3c" flood-opacity=".30"/></filter>
  <filter id="s-drop" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#123c3c" flood-opacity=".18"/></filter>
</defs>
<rect width="880" height="1200" fill="url(#s-room)"/>
<g id="safe-fit" transform="translate(440,600) scale(0.86) translate(-440,-600)">


<ellipse cx="440" cy="200" rx="340" ry="250" fill="url(#s-glow)"/>
