  <text x="228" y="484" font-size="21" fill="#7fa3a3">via Instagram DM</text>
  <rect x="156" y="520" width="392" height="98" rx="26" fill="#dcecec"/>
  <text x="188" y="560" fill="#143434">Are you taking new</text>
  <text x="188" y="596" fill="#143434">patients this month?</text>
  <g filter="url(#s-drop)"><rect x="242" y="642" width="468" height="138" rx="26" fill="url(#s-me)"/></g>
  <text x="274" y="682" fill="#fff">Yes! I have Friday 3:40</text>
  <text x="274" y="718" fill="#fff">or Monday 9:20 open &#8212;</text>
  <text x="274" y="754" fill="#fff">which suits you?</text>
  <g filter="url(#s-drop)"><rect x="156" y="806" width="554" height="106" rx="24" fill="#fff"/></g>
