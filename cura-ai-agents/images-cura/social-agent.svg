  <circle cx="344" cy="206" r="10" fill="#fff"/>
  <rect x="476" y="146" width="200" height="200" rx="56" fill="url(#s-badge2)"/>
  <rect x="476" y="146" width="200" height="200" rx="56" fill="url(#s-sheen)"/>
  <path d="M600 202h-24c-11 0-19 8-19 19v25h-24v32h24v80h34v-80h26l6-32h-32v-19c0-5 4-7 9-7h22z" fill="#fff"/>
